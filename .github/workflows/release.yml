# Baut fuer eine Mod ein Release mit ZIP (Vortex-tauglich).
# Start: GitHub > Actions > "Mod Release" > Run workflow (Modordner + Version eingeben)
name: Mod Release
on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Modordner, z.B. bow-and-bolt-adjuster'
        required: true
      version:
        description: 'Version, z.B. 1.0.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP bauen und Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ inputs.mod }}
          VER: ${{ inputs.version }}
        run: |
          test -d "$MOD" || { echo "Ordner $MOD fehlt"; exit 1; }
          TAG="${MOD}-v${VER}"
          cp LICENSE "$MOD/LICENSE.txt"
          (cd "$MOD" && zip -r "../${TAG}.zip" . -x "*.md" -x "*.zip")
          gh release create "$TAG" "${TAG}.zip" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$MOD/README.md"
