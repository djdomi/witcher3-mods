# Baut fuer eine Mod ein Release mit ZIP (Vortex-tauglich).
# Start: GitHub > Actions > "Mod Release" > Run workflow (Modordner + Version eingeben)
name: Mod Release
on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Modordner, z.B. bow-and-bolt-adjuster'
        required: true
      version:
        description: 'Version, z.B. 1.0.0'
        required: true
      prerelease:
        description: 'Test-Version (Pre-Release)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP bauen und Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ inputs.mod }}
          VER: ${{ inputs.version }}
          PRE: ${{ inputs.prerelease }}
        run: |
          test -d "$MOD" || { echo "Ordner $MOD fehlt"; exit 1; }
          TAG="${MOD}-v${VER}"
          cp LICENSE "$MOD/LICENSE.txt"
          FLAG=""
          if [ "$PRE" = "true" ]; then FLAG="--prerelease"; fi
          # Regel: niemals .bat/.cmd/.exe/.ps1/.vbs in einer Mod-ZIP (Virenscanner-Fehlalarme)
          (cd "$MOD" && zip -r "../${TAG}.zip" . -x "*.md" -x "*.zip" -x "*.bat" -x "*.cmd" -x "*.exe" -x "*.ps1" -x "*.vbs")
          if unzip -Z1 "${TAG}.zip" | grep -qiE '\.(bat|cmd|exe|ps1|vbs)$'; then echo "Verbotene Datei in ZIP"; exit 1; fi
          unzip -l "${TAG}.zip"
          gh release create "$TAG" "${TAG}.zip" $FLAG --target "$GITHUB_SHA" --title "$TAG" --notes-file "$MOD/README.md"
